spring.application.name=Robot-Minds

# ==================== Database Configuration ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/robot_minds
spring.datasource.username=khaled
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

server.port=8080
server.address=0.0.0.0

app.frontend-origin=http://localhost:5000

app.admin.username=admin
app.admin.email=admin@robotminds.local
app.admin.password=admin123

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB